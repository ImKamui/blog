<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<title>Найти друзей</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Подключение Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
	<nav class="navbar navbar-expand-lg bg-body-tertiary rounded">
		<div class="collapse navbar-collapse justify-content-md-center" id="navbar">
			<ul class="navbar-nav">
				<li class="nav-item">
					<a class="nav-link active" th:href="@{/main}">Главная</a>
				</li>
				<li class="nav-item">
					<a class="nav-link active" th:href="@{/main/new_post}">Создать пост</a>
				</li>
				<li class="nav-item">
					<a class="nav-link active" th:href="@{/main/my_posts}">Мои посты</a>
				</li>
				<li class="nav-item dropdown">
					<a class="nav-link dropdown-toggle active" id="navbarDropdownFriends" role="button" data-bs-toggle="dropdown">Друзья</a>
						<ul class="dropdown-menu">
							<li>
								<a th:href="@{/main/friends/my}" class="dropdown-item btn btn-link">Мои друзья</a>
							</li>
							<li>
								<a th:href="@{/main/friends/find}" class="dropdown-item btn btn-link">Найти друзей</a>
							</li>
						</ul>
				</li>
				<li class="nav-item dropdown">
				<a class="nav-link dropdown-toggle active" th:href="@{/main}" id="navbarDropdown" role="button" data-bs-toggle="dropdown">Профиль</a>
                        <ul class="dropdown-menu">
                            <li>
                            	<a th:href="@{/main/settings}" class="dropdown-item btn btn-link">Настройки</a>
                            </li>
                            <th:block sec:authorize="hasRole('ADMIN') or hasRole('KING_ADMIN')">
                            	<li>
                            		<a th:href="@{/main/admin}" class="dropdown-item btn btn-link">Админ-панель</a>
                            	</li>
                            </th:block>
                            <li>
                                <form th:action="@{/logout}" method="post" style="display: inline;">
                                    <button type="submit" class="dropdown-item btn btn-link">Выйти</button>
                                </form>
                            </li>
                       </ul>
				</li>
			</ul>
		</div>
	</nav>
	<th:block th:each="person : ${people}">
	    <div class="card mb-2">
	        <div class="card-body">
	            <h5 th:text="${person.username}">User</h5>
	            <!-- Кнопка меняется в зависимости от статуса -->
	            <form th:if="${friendshipStatus[person.id] == null}" 
	                  th:action="@{/main/friends/request/{id}(id=${person.id})}" 
	                  method="post" 
	                  class="d-inline">
	                <button type="submit" class="btn btn-primary">Добавить в друзья</button>
	            </form>
	            
	            <form th:if="${friendshipStatus[person.id] == 'PENDING'}" 
	                  th:action="@{/main/friends/cancel/{id}(id=${person.id})}" 
	                  method="post" 
	                  class="d-inline">
	                <button type="submit" class="btn btn-warning">Отменить заявку в друзья</button>
	            </form>
	            
	            <form th:if="${friendshipStatus[person.id] == 'ACCEPTED'}" 
	                  class="d-inline">
	                <button type="button" class="btn btn-success" disabled>Друзья</button>
	            </form>
	        </div>
	    </div>
	</th:block>
</body>
</html>
